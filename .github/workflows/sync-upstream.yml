name: Sync from Upstream

on:
  schedule:
    - cron: "0 0 * * *" # 每天自动同步一次上游
  workflow_dispatch:   # 支持在 GitHub Actions 页面手动点击按钮一键同步

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Merge Upstream
        run: |
          git remote add upstream https://github.com/beck-8/subs-check.git || true
          git fetch upstream master
          echo "Attempting to merge upstream/master into current branch..."
          git merge upstream/master -m "chore(sync): merge upstream changes from beck-8/subs-check" || {
            echo "::error::Merge conflict detected! Please check conflicts."
            exit 1
          }
          git push origin master
